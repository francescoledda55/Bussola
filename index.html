<style>
/* Layout: colonna unica da lettura (max 720px), striscia tessile in testa, schermate che si alternano: intro → domande → tappe → risultato */
:root{
  --bg:#f3f0e8; --surface:#fbf9f4; --ink:#1d1b17; --muted:#6a6355; --line:#d9d2c1;
  --gold:#a97c1c; --gold-soft:#f0e3c2; --red:#9e2a1f; --track:#e7e1d2;
  --fd:"Libre Baskerville", Georgia, "Times New Roman", serif;
  --fb:"Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --fm:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14130f; --surface:#1d1b16; --ink:#efe9da; --muted:#a69d89; --line:#36322a;
  --gold:#d9ae4e; --gold-soft:#3a2f17; --red:#d8604f; --track:#2b2821; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14130f; --surface:#1d1b16; --ink:#efe9da; --muted:#a69d89; --line:#36322a;
  --gold:#d9ae4e; --gold-soft:#3a2f17; --red:#d8604f; --track:#2b2821; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.band{height:14px;margin-inline:-16px;background:
  repeating-linear-gradient(90deg,transparent 0 6px,var(--gold) 6px 8px,transparent 8px 14px),
  repeating-linear-gradient(45deg,var(--red) 0 4px,transparent 4px 10px);
  opacity:.85}
.wrap{max-width:720px;margin:0 auto;padding-block:32px 0}
.eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--fd);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3.1rem);line-height:1.1}
h2{font-size:clamp(1.4rem,4vw,1.9rem);line-height:1.2}
h3{font-size:1.1rem}
p{margin:0}
.lede{font-size:1.08rem;max-width:62ch;color:var(--ink)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:32px}
.note{border-left:3px solid var(--red);padding:12px 16px;background:var(--surface);font-size:.95rem}
.note strong{color:var(--red)}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--fm);font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:12px 22px;font-weight:600;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* domanda */
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.counter{font-family:var(--fm);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--track);position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--gold);transition:width .25s}
.stages{display:flex;justify-content:space-between;font-family:var(--fm);font-size:11px;color:var(--muted)}
.stages span.on{color:var(--gold)}
.qtext{font-family:var(--fd);font-size:clamp(1.25rem,3.6vw,1.6rem);line-height:1.35;min-height:4.2em;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:13px 16px;border:1px solid var(--line);background:var(--surface);border-radius:2px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.opt .k{font-family:var(--fm);font-size:12px;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* tappa */
.stage-num{font-family:var(--fd);font-size:4rem;line-height:1;color:var(--gold)}

/* risultati */
.family{border:1px solid var(--line);background:var(--surface);padding:20px}
.family .tag{display:inline-block;font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--gold);color:var(--bg)}
.match-big{font-family:var(--fd);font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15}
.pct{font-family:var(--fm);font-variant-numeric:tabular-nums}
.axis{display:grid;gap:6px}
.axis .lab{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.axis .lab span:first-child,.axis .lab span:last-child{min-width:0}
.axis .name{font-family:var(--fm);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.bar{height:22px;background:var(--track);position:relative;display:flex}
.bar .l{background:var(--ink);height:100%}
.bar .r{background:var(--gold);height:100%;flex:1}
.bar .val{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-family:var(--fm);font-size:12px;color:var(--bg);mix-blend-mode:normal}
.bar .val b{font-weight:600}
.bar .val b:last-child{color:var(--ink)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.item .nm{font-weight:600;min-width:0}
.item .sub{grid-column:1/-1;font-size:14px;color:var(--muted)}
.item .meter{grid-column:1/-1;height:6px;background:var(--track)}
.item .meter i{display:block;height:100%;background:var(--gold)}
.chip{font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);color:var(--muted);margin-left:6px;white-space:nowrap}
.chip.ind{border-color:var(--gold);color:var(--gold)}
.chip.sar{border-color:var(--red);color:var(--red)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fig{border-top:2px solid var(--gold);padding-top:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fig.far{border-top-color:var(--red)}
.fig .pct{font-size:13px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:0}
.small{font-size:13px}
.small a{color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
.intl{display:grid;grid-template-columns:1fr minmax(0,320px);gap:24px;align-items:center}
@media (max-width:640px){.intl{grid-template-columns:1fr}}
.cwrap{max-width:320px;width:100%;justify-self:center}
.compass{width:100%;height:auto;display:block}
.compass .q1{fill:var(--red);opacity:.16}.compass .q2{fill:var(--ink);opacity:.1}
.compass .q3{fill:var(--gold);opacity:.18}.compass .q4{fill:var(--muted);opacity:.14}
.compass .grid{stroke:var(--line);stroke-width:1}
.compass .axisl{stroke:var(--muted);stroke-width:1.5}
.compass .ql{fill:var(--muted);font-family:var(--fm);font-size:9px}
.compass .al{fill:var(--ink);font-family:var(--fm);font-size:9px;letter-spacing:.1em}
.compass .you{fill:var(--gold);stroke:var(--bg);stroke-width:2.5}
.compass .ring{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 2}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.lg-you{background:var(--gold)}.lg-ring{border:1.5px dashed var(--ink)}
#copybox{width:100%;min-height:120px;font-family:var(--fm);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

 ['Konrad Adenauer','1876–1967',[.3,.3,-.5,-.8],'Cancelliere democristiano, padre della Germania occidentale.'],
 ['Charles de Gaulle','1890–1970',[.1,.7,-.5,.6],'Generale e presidente, portò la Francia fuori dal comando NATO.'],
 ['Václav Havel','1936–2011',[.3,-.5,.4,-.6],'Dissidente e presidente della Cecoslovacchia libera.'],
 ['Margaret Thatcher','1925–2013',[.9,.5,-.4,-.9],'Premier britannica del liberismo e della Guerra fredda.'],
 ['Ronald Reagan','1911–2004',[.8,.3,-.6,-1],'Presidente americano del libero mercato e dell\'anticomunismo.']
];

/* ===================== CALCOLO ===================== */
function scores(ans){
  const s={},d={}; AX.forEach(a=>{s[a.k]=0;d[a.k]=0});
  Q.forEach((q,i)=>{ const v=ans[i]==null?0:ans[i]; s[q.ax]+=v*q.dir*q.w; d[q.ax]+=2*q.w; });
  const out={}; AX.forEach(a=>out[a.k]= d[a.k]? s[a.k]/d[a.k] : 0); return out;
}
const ORDER = ['sov','ide','str','eco','soc','ter','mon'];
function dist(sc,vec){ let t=0; ORDER.forEach((k,i)=>{const x=sc[k]-vec[i]; t+=W[k]*x*x}); return Math.sqrt(t); }
const DMAX = 2*Math.sqrt(ORDER.reduce((a,k)=>a+W[k],0));
function pct(d){ return Math.max(0,Math.round(100*(1-d/(DMAX*.55)))); }
function rankIntl(sc){ return INTL.map(x=>({x,d:Math.sqrt(INTL_AX.reduce((t,k,i)=>t+(sc[k]-x[1][i])**2,0))})).sort((a,b)=>a.d-b.d); }
function rankW(list,sc,vi){ return list.map(x=>({x,d:Math.sqrt(WAX.reduce((t,k,i)=>t+(sc[k]-x[vi][i])**2,0))})).sort((a,b)=>a.d-b.d); }
function wpct(d){ return Math.max(0,Math.round(100*(1-d/2))); }
function ipct(d){ return Math.max(0,Math.round(100*(1-d/(2*Math.sqrt(3)*.5)))); }
function compass(sc,top){
  const P=24,S=272,X=v=>P+(v+1)/2*S,Y=v=>P+(1-v)/2*S;
  const ux=X(sc.eco),uy=Y(sc.aut),ix=X(top.x[1][0]),iy=Y(top.x[1][1]);
  return `<svg class="compass" viewBox="0 0 320 320" role="img" aria-label="Bussola politica: economia ${Math.round(sc.eco*100)}, autorità ${Math.round(sc.aut*100)}">
   <rect class="q1" x="${P}" y="${P}" width="${S/2}" height="${S/2}"/><rect class="q2" x="${P+S/2}" y="${P}" width="${S/2}" height="${S/2}"/>
   <rect class="q3" x="${P}" y="${P+S/2}" width="${S/2}" height="${S/2}"/><rect class="q4" x="${P+S/2}" y="${P+S/2}" width="${S/2}" height="${S/2}"/>
   ${[1,2,3,5,6,7].map(i=>`<line class="grid" x1="${P+i*S/8}" y1="${P}" x2="${P+i*S/8}" y2="${P+S}"/><line class="grid" x1="${P}" y1="${P+i*S/8}" x2="${P+S}" y2="${P+i*S/8}"/>`).join('')}
   <line class="axisl" x1="${P+S/2}" y1="${P}" x2="${P+S/2}" y2="${P+S}"/><line class="axisl" x1="${P}" y1="${P+S/2}" x2="${P+S}" y2="${P+S/2}"/>
   <text class="ql" x="${P+6}" y="${P+14}">Sinistra autoritaria</text><text class="ql" x="${P+S-6}" y="${P+14}" text-anchor="end">Destra autoritaria</text>
   <text class="ql" x="${P+6}" y="${P+S-7}">Sinistra libertaria</text><text class="ql" x="${P+S-6}" y="${P+S-7}" text-anchor="end">Destra libertaria</text>
   <text class="al" x="160" y="15" text-anchor="middle">AUTORITÀ</text><text class="al" x="160" y="314" text-anchor="middle">LIBERTÀ</text>
   <text class="al" x="12" y="160" text-anchor="middle" transform="rotate(-90 12 160)">UGUAGLIANZA</text><text class="al" x="308" y="160" text-anchor="middle" transform="rotate(90 308 160)">MERCATO</text>
   <circle class="ring" cx="${ix}" cy="${iy}" r="7"/>
   <circle class="you" cx="${ux}" cy="${uy}" r="8"/>
  </svg>`;
}
function rankBy(list,sc,vi){ return list.map(x=>({x,d:dist(sc,x[vi])})).sort((a,b)=>a.d-b.d); }
function family(sc){
  if(sc.sov>=.3) return ['Indipendentismo','Vuoi una Sardegna sovrana. Il resto delle tue risposte dice che tipo di Repubblica hai in mente e come pensi di arrivarci.'];
  if(sc.ide>=.3) return ['Sardismo','Identità sarda forte, ma dentro la cornice dello Stato italiano: è autonomismo con un cuore identitario. Non è indipendentismo, e anzi spesso gli indipendentisti lo combattono.'];
  if(sc.sov>-.4) return ['Autonomismo','La specialità sarda va difesa e rafforzata, ma la Sardegna resta una regione italiana. L\'identità non è il centro del tuo discorso politico.'];
  return ['Unionismo','La Sardegna è Italia e basta. Lo Statuto speciale è al massimo uno strumento amministrativo.'];
}

/* ===================== STATO ===================== */
let ans = new Array(Q.length).fill(null), idx = 0, view = 'intro';
try{ const s=JSON.parse(localStorage.getItem('bps2')||'null'); if(s&&s.ans&&s.ans.length===Q.length){ans=s.ans; idx=s.idx||0; if(s.view==='result'||s.view==='q') view=s.view;} }catch(e){}
function save(){ try{localStorage.setItem('bps2',JSON.stringify({ans,idx,view}))}catch(e){} }
const app = document.getElementById('app');
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){ save(); window.scrollTo({top:0}); ({intro,q:question,stage,result})[view](); }

function intro(){
  const started = ans.some(a=>a!==null);
  app.innerHTML = `<div class="stack-lg">
   <div class="stack">
    <span class="eyebrow">Sa bússola · edizione indipendentista</span>
    <h1>Bússola Politica Sarda</h1>
    <p class="lede">${Q.length} affermazioni per capire dove ti collochi nella politica sarda e in quella del mondo. Alla fine ottieni la tua famiglia politica, l'ideologia sarda più vicina fra ${IDEO.length}, l'ideologia internazionale fra ${INTL.length} con la bussola classica, l'affinità con ${PARTIES.length} partiti sardi e ${WPARTIES.length} partiti e movimenti del mondo, e i personaggi più simili a te fra ${FIGS.length} sardi e ${WFIGS.length} internazionali.</p>
   </div>
   <div class="note"><strong>Sardismo non è indipendentismo.</strong> In questo test il sardismo è trattato come autonomismo con una forte identità, che governa dentro lo Stato italiano. L'indipendentismo è una tradizione distinta e in competizione, che punta a una Repubblica di Sardegna. Per questo identità e sovranità sono due assi separati.</div>
   <div class="facts"><span><b>${AX.length}</b> assi</span><span><b>${Q.length}</b> domande</span><span><b>${IDEO.length+INTL.length}</b> ideologie</span><span><b>${PARTIES.length+WPARTIES.length}</b> partiti e movimenti</span><span><b>${FIGS.length+WFIGS.length}</b> personaggi</span><span>circa <b>15</b> minuti</span></div>
   <div class="row">
     <button class="btn" id="go">${started?'Riprendi da dove eri':'Comincia'}</button>
     ${started?'<button class="btn ghost" id="reset">Ricomincia da capo</button>':''}
   </div>
   <p class="small muted">Le domande guardano la politica sarda dal punto di vista dell'indipendentismo: molte servono a distinguere le correnti indipendentiste tra loro. Alcune sono volutamente balorde.</p>
  </div>`;
  go.onclick=()=>{view='q'; render()};
  if(started) reset.onclick=()=>{ans.fill(null);idx=0;view='q';render()};
}

function question(){
  const q=Q[idx], b=BLOCKS[q.block];
  const done = Math.round(100*idx/Q.length);
  app.innerHTML = `<div class="stack-lg">
   <div class="stack">
    <div class="qhead"><span class="eyebrow">${esc(b.t)}</span><span class="counter">${idx+1} / ${Q.length}</span></div>
    <div class="prog"><i style="width:${done}%"></i></div>
    <div class="stages">${['Inizio',...STAGES.map((s,i)=>'Tappa '+(i+1)),'Risultato'].map((t,i)=>`<span class="${(i===0||idx>=[0,...STAGES,Q.length][i])?'on':''}">${t}</span>`).join('')}</div>
   </div>
   <p class="qtext">${esc(q.text)}</p>
   <div class="opts" role="group" aria-label="Risposte">
     ${OPTS.map((o,i)=>`<button class="opt ${ans[idx]===o.v?'sel':''}" data-v="${o.v}" id="opt${i}"><span>${o.t}</span><span class="k">${i+1}</span></button>`).join('')}
   </div>
   <div class="row" style="justify-content:space-between">
     <button class="link" id="back">${idx===0?'Torna all\'inizio':'Domanda precedente'}</button>
     ${ans[idx]!==null&&idx<Q.length-1?'<button class="link" id="fwd">Avanti</button>':''}
   </div>
  </div>`;
  app.querySelectorAll('.opt').forEach(el=>el.onclick=()=>pick(+el.dataset.v));
  back.onclick=()=>{ if(idx===0){view='intro'} else idx--; render(); };
  const f=document.getElementById('fwd'); if(f) f.onclick=()=>{idx++;render()};
}
function pick(v){
  ans[idx]=v;
  if(idx===Q.length-1){ view='result'; return render(); }
  idx++;
  if(STAGES.includes(idx)) view='stage';
  render();
}
document.addEventListener('keydown',e=>{ if(view==='q'&&/^[1-5]$/.test(e.key)) pick(OPTS[+e.key-1].v); });

function stage(){
  const n=STAGES.indexOf(idx), sc=scores(ans), fam=family(sc);
  app.innerHTML = `<div class="stack-lg">
    <div class="stack"><span class="stage-num">${n+1}/3</span><h2>${STAGE_TXT[n][0]}</h2><p class="lede">${STAGE_TXT[n][1]}</p></div>
    <p class="muted">Per ora l'ago punta verso <b style="color:var(--gold)">${fam[0]}</b>. Può ancora cambiare.</p>
    <div><button class="btn" id="cont">Continua</button></div>
  </div>`;
  cont.onclick=()=>{view='q';render()};
}

function axisBar(a,v){
  const r = Math.round((v+1)*50), l=100-r;
  return `<div class="axis"><div class="name">${a.name}</div>
   <div class="lab"><span>${a.l}</span><span>${a.r}</span></div>
   <div class="bar" role="img" aria-label="${a.name}: ${a.l} ${l}%, ${a.r} ${r}%"><div class="l" style="width:${l}%"></div><div class="r"></div>
   <div class="val"><b>${l}%</b><b>${r}%</b></div></div></div>`;
}

function result(){
  const sc=scores(ans), fam=family(sc);
  const ideos=rankBy(IDEO,sc,1), parties=rankBy(PARTIES,sc,2), figs=rankBy(FIGS,sc,2);
  const top=ideos[0], intl=rankIntl(sc), it=intl[0];
  const far=figs[figs.length-1];
  const wp=rankW(WPARTIES,sc,3), wf=rankW(WFIGS,sc,2), wfar=wf[wf.length-1];
  app.innerHTML = `<div class="stack-lg">
   <div class="stack"><span class="eyebrow">Il tuo risultato</span><h1>Bússola Politica Sarda</h1></div>

   <section class="family stack">
     <div><span class="tag">${fam[0]}</span></div>
     <p>${fam[1]}</p>
   </section>

   <section class="stack">
     <span class="eyebrow">Sul piano sardo</span>
     <div class="row" style="justify-content:space-between;align-items:baseline"><p class="match-big">${esc(top.x[0])}</p><span class="pct">${pct(top.d)}%</span></div>
     <p class="lede">${esc(top.x[2])}</p>
     <div class="list">${ideos.slice(1,6).map(o=>`<div class="item"><span class="nm">${esc(o.x[0])}</span><span class="pct">${pct(o.d)}%</span><div class="meter"><i style="width:${pct(o.d)}%"></i></div></div>`).join('')}</div>
   </section>

   <hr>
   <section class="stack">
     <span class="eyebrow">Sul piano internazionale</span>
     <div class="intl">
       <div class="stack" style="min-width:0">
         <p class="muted small">Fuori dalla questione sarda, con gli assi classici dei test politici, la tua ideologia è:</p>
         <div class="row" style="justify-content:space-between;align-items:baseline"><p class="match-big">${esc(it.x[0])}</p><span class="pct">${ipct(it.d)}%</span></div>
         <p>${esc(it.x[2])}</p>
         <div class="legend small"><span><i class="lg-you"></i>Tu</span><span><i class="lg-ring"></i>${esc(it.x[0])}</span></div>
       </div>
       <div class="cwrap">${compass(sc,it)}</div>
     </div>
     <div class="list">${intl.slice(1,6).map(o=>`<div class="item"><span class="nm">${esc(o.x[0])}</span><span class="pct">${ipct(o.d)}%</span><div class="meter"><i style="width:${ipct(o.d)}%"></i></div></div>`).join('')}</div>
   </section>

   <hr>
   <section class="stack-lg">
     <div class="stack"><span class="eyebrow">I tuoi assi</span><h2>Dove punta l'ago</h2></div>
     ${AX.map(a=>axisBar(a,sc[a.k])).join('')}
   </section>

   <hr>
   <section class="stack">
     <div class="stack"><span class="eyebrow">Affinità con i partiti</span><h2>I partiti, dal più vicino al più lontano</h2></div>
     <div class="list">${parties.map(o=>{const f=FAM[o.x[1]];return `<div class="item"><span class="nm">${esc(o.x[0])}<span class="chip ${f[1]}">${f[0]}</span></span><span class="pct">${pct(o.d)}%</span><div class="meter"><i style="width:${pct(o.d)}%"></i></div><span class="sub">${esc(o.x[3])}</span></div>`}).join('')}</div>
   </section>

   <hr>
   <section class="stack">
     <div class="stack"><span class="eyebrow">Personaggi</span><h2>Ti somigliano, in Sardegna</h2></div>
     <div class="figs">
       ${figs.slice(0,3).map(o=>`<div class="fig"><h3>${esc(o.x[0])}</h3><span class="pct">${o.x[1]?esc(o.x[1])+' · ':''}${pct(o.d)}%</span><span class="small muted">${esc(o.x[3])}</span></div>`).join('')}
       <div class="fig far"><span class="eyebrow" style="color:var(--red)">Il più lontano</span><h3>${esc(far.x[0])}</h3><span class="small muted">${esc(far.x[3])}</span></div>
     </div>
   </section>


   <hr>
   <section class="stack">
     <div class="stack"><span class="eyebrow">Nel mondo</span><h2>Partiti e movimenti internazionali</h2><p class="muted small">Calcolati su economia, Stato, società e politica estera. I primi otto, più il più lontano.</p></div>
     <div class="list">${[...wp.slice(0,8),wp[wp.length-1]].map((o,i)=>`<div class="item"${i===8?' style="margin-top:12px"':''}><span class="nm">${i===8?'<span class="eyebrow" style="color:var(--red)">Il più lontano · </span>':''}${esc(o.x[0])}<span class="chip ${o.x[2]?'ind':''}">${esc(o.x[1])}</span></span><span class="pct">${wpct(o.d)}%</span><div class="meter"><i style="width:${wpct(o.d)}%"></i></div><span class="sub">${esc(o.x[4])}</span></div>`).join('')}</div>
     <p class="small muted"><span class="chip ind" style="margin-left:0">Oro</span> nazioni senza Stato.</p>
   </section>

   <hr>
   <section class="stack">
     <div class="stack"><span class="eyebrow">Personaggi nel mondo</span><h2>Ti somigliano, fuori dall'isola</h2></div>
     <div class="figs">
       ${wf.slice(0,3).map(o=>`<div class="fig"><h3>${esc(o.x[0])}</h3><span class="pct">${o.x[1]?esc(o.x[1])+' · ':''}${wpct(o.d)}%</span><span class="small muted">${esc(o.x[3])}</span></div>`).join('')}
       <div class="fig far"><span class="eyebrow" style="color:var(--red)">Il più lontano</span><h3>${esc(wfar.x[0])}</h3><span class="small muted">${esc(wfar.x[3])}</span></div>
     </div>
   </section>

   <hr>
   <section class="stack">
     <div class="row">
       <button class="btn" id="copy">Copia il risultato</button>
       <button class="btn ghost" id="redo">Rifai il test</button>
       <button class="btn ghost" id="review">Rivedi le risposte</button>
     </div>
     <textarea id="copybox" hidden readonly></textarea>
     <p class="small muted" id="copymsg" aria-live="polite"></p>
   </section>

   <details class="small muted">
     <summary>Come funziona e fonti</summary>
     <div class="stack" style="margin-top:12px">
      <p>Ogni risposta sposta l'ago su uno degli otto assi, da −100 a +100. Ideologie, partiti e personaggi hanno una posizione stimata sugli stessi assi; l'affinità è la vicinanza tra la tua posizione e la loro, con un peso maggiore per l'asse della sovranità.</p>
      <p>Le posizioni di partiti e personaggi sono stime basate su posizioni pubbliche, alleanze elettorali del 2024 e prese di posizione recenti (Pratobello 24, basi, energia). Sono semplificazioni, non schede ufficiali.</p>
      <p>Partiti e personaggi internazionali sono confrontati solo su quattro assi che hanno senso fuori dalla Sardegna (economia, Stato, società, politica estera), perché sovranità e identità sarde non si applicano a loro.</p>
      <p>La famiglia politica dipende prima dalla sovranità, poi dall'identità: con sovranità alta sei indipendentista anche con identità civica; con sovranità bassa e identità alta sei sardista.</p>
      <p><a href="https://it.wikipedia.org/wiki/Indipendentismo_sardo" target="_blank" rel="noopener">Indipendentismo sardo</a> · <a href="https://it.wikipedia.org/wiki/Elezioni_regionali_in_Sardegna_del_2024" target="_blank" rel="noopener">Regionali 2024</a> · <a href="https://www.linkoristano.it/2024/06/29/non-piu-disuniti-gli-indipendentisti-sardi-scelgono-una-nuova-via-con-republica/" target="_blank" rel="noopener">Nascita di Repùblica</a> · <a href="https://it.wikipedia.org/wiki/Sardigna_Natzione_Indipendentzia" target="_blank" rel="noopener">SNI</a></p>
     </div>
   </details>
  </div>`;
  const txt = `Bússola Politica Sarda\nFamiglia: ${fam[0]}\nIdeologia sarda: ${top.x[0]} (${pct(top.d)}%)\nIdeologia internazionale: ${it.x[0]} (${ipct(it.d)}%)\n`+
    AX.map(a=>`${a.name}: ${a.l} ${100-Math.round((sc[a.k]+1)*50)}% · ${a.r} ${Math.round((sc[a.k]+1)*50)}%`).join('\n')+
    `\nPartito più vicino: ${parties[0].x[0]} (${pct(parties[0].d)}%)\nNel mondo: ${wp[0].x[0]} (${wpct(wp[0].d)}%)\nPersonaggio: ${figs[0].x[0]} · nel mondo: ${wf[0].x[0]}`;
  copy.onclick=()=>{
    const fb=()=>{copybox.hidden=false;copybox.value=txt;copybox.select();copymsg.textContent='Testo selezionato: copialo a mano.'};
    try{ navigator.clipboard.writeText(txt).then(()=>copymsg.textContent='Risultato copiato.',fb); }catch(e){fb()}
  };
  redo.onclick=()=>{ans.fill(null);idx=0;view='intro';render()};
  review.onclick=()=>{idx=0;view='q';render()};
}

render();
</script>

</body></html>

<title>Bússola Filosofica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Libre+Franklin:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: colonna unica da lettura (max 720px), striscia tessile in testa, schermate che si alternano: intro → domande → tappe → risultato */
:root{
  --bg:#f3f0e8; --surface:#fbf9f4; --ink:#1d1b17; --muted:#6a6355; --line:#d9d2c1;
  --gold:#a97c1c; --gold-soft:#f0e3c2; --red:#9e2a1f; --track:#e7e1d2;
  --fd:"Libre Baskerville", Georgia, "Times New Roman", serif;
  --fb:"Libre Franklin", "Helvetica Neue", Arial, sans-serif;
  --fm:"JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14130f; --surface:#1d1b16; --ink:#efe9da; --muted:#a69d89; --line:#36322a;
  --gold:#d9ae4e; --gold-soft:#3a2f17; --red:#d8604f; --track:#2b2821; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14130f; --surface:#1d1b16; --ink:#efe9da; --muted:#a69d89; --line:#36322a;
  --gold:#d9ae4e; --gold-soft:#3a2f17; --red:#d8604f; --track:#2b2821; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.band{height:14px;margin-inline:-16px;background:
  repeating-linear-gradient(90deg,transparent 0 6px,var(--gold) 6px 8px,transparent 8px 14px),
  repeating-linear-gradient(45deg,var(--red) 0 4px,transparent 4px 10px);
  opacity:.85}
.wrap{max-width:720px;margin:0 auto;padding-block:32px 0}
.eyebrow{font-family:var(--fm);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
h1,h2,h3{font-family:var(--fd);font-weight:700;text-wrap:balance;margin:0}
h1{font-size:clamp(2rem,6vw,3.1rem);line-height:1.1}
h2{font-size:clamp(1.4rem,4vw,1.9rem);line-height:1.2}
h3{font-size:1.1rem}
p{margin:0}
.lede{font-size:1.08rem;max-width:62ch;color:var(--ink)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-lg{display:flex;flex-direction:column;gap:32px}
.note{border-left:3px solid var(--red);padding:12px 16px;background:var(--surface);font-size:.95rem}
.note strong{color:var(--red)}
.facts{display:flex;flex-wrap:wrap;gap:8px 20px;font-family:var(--fm);font-size:13px;color:var(--muted)}
.facts b{color:var(--ink);font-weight:600}
button{font:inherit;cursor:pointer;color:inherit}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:12px 22px;font-weight:600;border-radius:2px}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn:focus-visible,.opt:focus-visible,.link:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

/* domanda */
.qhead{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.counter{font-family:var(--fm);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:4px;background:var(--track);position:relative}
.prog i{position:absolute;inset:0 auto 0 0;background:var(--gold);transition:width .25s}
.stages{display:flex;justify-content:space-between;font-family:var(--fm);font-size:11px;color:var(--muted)}
.stages span.on{color:var(--gold)}
.qtext{font-family:var(--fd);font-size:clamp(1.25rem,3.6vw,1.6rem);line-height:1.35;min-height:4.2em;text-wrap:pretty}
.opts{display:grid;gap:8px}
.opt{display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;padding:13px 16px;border:1px solid var(--line);background:var(--surface);border-radius:2px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--gold)}
.opt.sel{border-color:var(--gold);background:var(--gold-soft)}
.opt .k{font-family:var(--fm);font-size:12px;color:var(--muted)}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

/* tappa */
.stage-num{font-family:var(--fd);font-size:4rem;line-height:1;color:var(--gold)}

/* risultati */
.family{border:1px solid var(--line);background:var(--surface);padding:20px}
.family .tag{display:inline-block;font-family:var(--fm);font-size:12px;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;background:var(--gold);color:var(--bg)}
.match-big{font-family:var(--fd);font-size:clamp(1.7rem,5vw,2.4rem);line-height:1.15}
.pct{font-family:var(--fm);font-variant-numeric:tabular-nums}
.axis{display:grid;gap:6px}
.axis .lab{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.axis .lab span:first-child,.axis .lab span:last-child{min-width:0}
.axis .name{font-family:var(--fm);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.bar{height:22px;background:var(--track);position:relative;display:flex}
.bar .l{background:var(--ink);height:100%}
.bar .r{background:var(--gold);height:100%;flex:1}
.bar .val{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 8px;font-family:var(--fm);font-size:12px;color:var(--bg);mix-blend-mode:normal}
.bar .val b{font-weight:600}
.bar .val b:last-child{color:var(--ink)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 12px;align-items:baseline}
.item .nm{font-weight:600;min-width:0}
.item .sub{grid-column:1/-1;font-size:14px;color:var(--muted)}
.item .meter{grid-column:1/-1;height:6px;background:var(--track)}
.item .meter i{display:block;height:100%;background:var(--gold)}
.chip{font-family:var(--fm);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border:1px solid var(--line);color:var(--muted);margin-left:6px;white-space:nowrap}
.chip.ind{border-color:var(--gold);color:var(--gold)}
.chip.sar{border-color:var(--red);color:var(--red)}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.fig{border-top:2px solid var(--gold);padding-top:10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.fig.far{border-top-color:var(--red)}
.fig .pct{font-size:13px;color:var(--muted)}
hr{border:0;border-top:1px solid var(--line);margin:0}
.small{font-size:13px}
.small a{color:var(--muted)}
details summary{cursor:pointer;font-weight:600}
.intl{display:grid;grid-template-columns:1fr minmax(0,320px);gap:24px;align-items:center}
@media (max-width:640px){.intl{grid-template-columns:1fr}}
.cwrap{max-width:320px;width:100%;justify-self:center}
.compass{width:100%;height:auto;display:block}
.compass .q1{fill:var(--red);opacity:.16}.compass .q2{fill:var(--ink);opacity:.1}
.compass .q3{fill:var(--gold);opacity:.18}.compass .q4{fill:var(--muted);opacity:.14}
.compass .grid{stroke:var(--line);stroke-width:1}
.compass .axisl{stroke:var(--muted);stroke-width:1.5}
.compass .ql{fill:var(--muted);font-family:var(--fm);font-size:9px}
.compass .al{fill:var(--ink);font-family:var(--fm);font-size:9px;letter-spacing:.1em}
.compass .you{fill:var(--gold);stroke:var(--bg);stroke-width:2.5}
.compass .ring{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:3 2}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-2px}
.lg-you{background:var(--gold)}.lg-ring{border:1.5px dashed var(--ink)}
#copybox{width:100%;min-height:120px;font-family:var(--fm);font-size:12px;background:var(--surface);color:var(--ink);border:1px solid var(--line);padding:8px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* aggiunte della Bússola Filosofica */
.lede a,.note a{color:inherit;text-underline-offset:3px}
.modes{display:grid;gap:10px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;padding:16px 18px;border:1px solid var(--line);background:var(--surface);border-radius:2px;transition:border-color .12s,background .12s}
.mode:hover{border-color:var(--gold);background:var(--gold-soft)}
.mode:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.mode .mt{font-family:var(--fd);font-weight:700;font-size:1.2rem}
.mode .md{font-family:var(--fm);font-size:12px;color:var(--muted)}
.sardi{border:1px solid var(--line);background:var(--surface);padding:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:24px}
@media (max-width:640px){.two{grid-template-columns:1fr}}
.pos{font-size:15px}
.knot{border-left:3px solid var(--gold);padding:10px 16px;background:var(--surface);display:flex;flex-direction:column;gap:6px}
.knot.quirk{border-left-color:var(--muted)}
.knot p{font-size:15px}
.bridge{border-left:3px solid var(--red);padding:10px 16px;background:var(--surface)}
.pairs{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pair{border:1px solid var(--line);padding:12px;display:grid;gap:12px;min-width:0}
.mini .lab{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);align-items:baseline}
.mini .lab b{font-family:var(--fm);font-weight:600;color:var(--ink);text-transform:uppercase;letter-spacing:.06em;font-size:11px;text-align:center}
.mini .lab span{min-width:0}
.mini .track{position:relative;height:8px;background:var(--track);margin-top:4px}
.mini .track:after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--muted)}
.mini .track i{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--gold);border:2px solid var(--bg);transform:translate(-50%,-50%)}
details.area{border-top:1px solid var(--line);padding-top:12px}
details.area summary{display:flex;align-items:baseline;gap:12px;font-family:var(--fd);font-size:1.1rem;list-style:none}
details.area summary::-webkit-details-marker{display:none}
details.area summary:after{content:"+";font-family:var(--fm);color:var(--gold);margin-left:auto}
details.area[open] summary:after{content:"−"}
details.area summary .small{font-family:var(--fb);font-weight:400}
</style>

<script>

   Ogni asse va da −1 (polo sinistro, l) a +1 (polo destro, r).
   lp / rp: come il risultato descrive chi sta su quel polo.
   Domande: [testo, direzione, peso]. Direzione +1 = essere d'accordo spinge verso il polo destro.
   Per ogni asse le prime tre domande sono della versione essenziale, le ultime due solo della completa. */

 {t:'Il mondo', d:'Che cosa esiste, che cos’è la mente, che cosa ci dice la scienza.'},
 {t:'Il conoscere', d:'Come sappiamo quello che sappiamo, cosa fanno le parole, che cos’è il bello.'},
 {t:'Il bene', d:'Come si decide cosa è giusto, da dove viene la morale, chi siamo e cosa ci rende felici.'},
 {t:'La città e il sacro', d:'Società, potere, storia e Dio.'}
];
const AREAS = [
 {k:'ess', part:0, t:'Essere', sub:'Metafisica · che cosa esiste', ax:[

   lp:'pensi che la realtà sia, in fondo, soltanto materia ed energia', rp:'pensi che la realtà non si esaurisca nella materia', q:[

   ['Esistono realtà vere che nessuno strumento scientifico potrà mai misurare.',1],
   ['Quando moriamo, di noi non resta nulla oltre al corpo e al ricordo che lasciamo.',-1],
   ['Numeri, verità logiche e leggi morali esistono davvero, anche se non sono fatti di niente.',1],
   ['Parlare di «spirito» è solo un modo poetico di indicare processi fisici molto complessi.',-1]]},
  {k:'lib', name:'Libertà', l:'Libero arbitrio', r:'Determinismo',
   lp:'sei convinto che le nostre scelte siano davvero libere', rp:'pensi che le nostre scelte siano determinate da cause che non controlliamo', q:[
   ['Le mie scelte sono davvero mie: avrei potuto fare diversamente.',-1],
   ['Se conoscessimo tutto il passato di una persona, potremmo prevedere ogni sua decisione.',1],
   ['La sensazione di scegliere liberamente è un’illusione prodotta dal cervello.',1],
   ['Anche chi cresce in un ambiente terribile resta responsabile di ciò che diventa.',-1],
   ['Geni, educazione e caso spiegano chi siamo molto più della nostra volontà.',1]]},
  {k:'div', name:'Le cose', l:'Nature stabili', r:'Tutto diviene',
   lp:'credi che ogni cosa abbia una natura propria e stabile', rp:'vedi il mondo come un flusso, in cui le cose sono momenti di un processo', q:[
   ['Ogni cosa ha una natura propria, un «che cos’è» che non dipende da come la chiamiamo.',-1],
   ['Le categorie con cui dividiamo il mondo (specie, colori, generi) sono etichette nostre, non confini reali.',1],

   ['Dire che qualcosa è «contro natura» non ha senso, perché la natura non ha un progetto.',1]]}
 ]},
 {k:'men', part:0, t:'Mente', sub:'Filosofia della mente · chi pensa in noi', ax:[

   ['La mente è semplicemente ciò che fa il cervello.',-1],
   ['Anche conoscendo ogni neurone di una persona, non sapremmo che cosa si prova a essere lei.',1],
   ['Un giorno le neuroscienze spiegheranno completamente pensieri ed emozioni.',-1],
   ['Il rosso che vedo, il dolore che sento: questa esperienza interiore non si riduce a impulsi elettrici.',1],

  {k:'ego', name:'Io', l:'Io stabile', r:'Io come flusso',
   lp:'senti che dentro di te c’è un io che resta lo stesso', rp:'vedi l’io come un insieme di ricordi e abitudini che cambia di continuo', q:[
   ['C’è un «io» che resta lo stesso dalla mia infanzia a oggi.',-1],
   ['Quello che chiamo «io» è un insieme di ricordi, abitudini e sensazioni che cambiano continuamente.',1],

  {k:'cos', name:'Coscienza', l:'Solo umana', r:'Diffusa',

 ]},
 {k:'sci', part:0, t:'Scienza e tecnica', sub:'Filosofia della scienza · che cosa ci dicono le teorie', ax:[

  {k:'tec', name:'Tecnica', l:'Fiducia', r:'Sospetto',

 ]},
 {k:'con', part:1, t:'Conoscenza', sub:'Gnoseologia · come sappiamo quello che sappiamo', ax:[

   ['Una teoria elegante e coerente vale poco finché non viene confermata dai fatti.',1],
   ['La matematica scopre verità necessarie, non semplici abitudini della mente.',-1]]},
  {k:'rea', name:'Il mondo conosciuto', l:'Com’è', r:'Come lo costruiamo',
   lp:'credi che si possa conoscere il mondo com’è davvero', rp:'pensi che conosciamo il mondo sempre attraverso filtri che lo costruiscono', q:[

   ['Ciò che chiamiamo «realtà» è in gran parte una costruzione condivisa.',1],
   ['Se l’umanità sparisse, montagne, stelle e leggi della fisica resterebbero esattamente come sono.',-1],

  {k:'dub', name:'Certezza', l:'Certezze possibili', r:'Dubbio',

   ['Ci sono cose di cui posso essere assolutamente certo.',-1],

   ['Sulle grandi domande (Dio, il bene, il senso della vita) è più onesto sospendere il giudizio.',1],

  {k:'vie', name:'Vie del sapere', l:'Solo la scienza', r:'Molte vie',

   ['Intuizioni e sensazioni di pancia sono fonti di conoscenza poco affidabili.',-1],

 ]},
 {k:'lin', part:1, t:'Linguaggio', sub:'Filosofia del linguaggio · che cosa fanno le parole', ax:[

function scores(ans){
  const s={},d={}; AX.forEach(a=>{s[a.k]=0;d[a.k]=0});
  ALLQ.forEach(q=>{ const v=ans[q.id]; if(v==null) return; s[q.ax]+=v*q.dir*q.w; d[q.ax]+=2*q.w; });
  const out={}; AX.forEach(a=>out[a.k]= d[a.k]? s[a.k]/d[a.k] : 0); return out;
}
/* Affinità calcolata solo sugli assi su cui il profilo ha una posizione.
   Metà conta la distanza (quanto sei lontano), metà la direzione (se pendi dalla stessa parte):
   così chi risponde in modo prudente non finisce sempre sulle scuole più moderate.
   Un piccolo correttivo evita che i profili con pochi assi vincano per caso. */
function match(sc,prof){
  let t=0,n=0,d=0,nu=0,np=0;
  for(const k in prof){ const u=sc[k],p=prof[k]; t+=(u-p)**2; n++; d+=u*p; nu+=u*u; np+=p*p; }
  const dist=Math.sqrt((t+.45)/(n+1.5))/2, dir=1-d/(Math.sqrt(nu*np)+.3);
  const rank=.5*dist+.5*dir*(n/(n+2))+.5*(2/(n+2));
  return {rank,pct:Math.max(0,Math.min(99,Math.round(100*(1.12-rank*1.1))))};
}
function rank(list,sc,pi){ return list.map(x=>({x,...match(sc,x[pi])})).sort((a,b)=>a.rank-b.rank); }
const PART_PRE = ['Sul mondo','Sul conoscere','Sul bene','Sulla città e sul sacro'];
function portrait(sc){
  return PARTS.map((p,pi)=>{
    const axs=AX.filter(a=>AREAS[a.area].part===pi).sort((a,b)=>Math.abs(sc[b.k])-Math.abs(sc[a.k]));
    const a=axs[0], v=sc[a.k];
    if(Math.abs(v)<.2) return `${PART_PRE[pi]} non hai posizioni nette: tieni aperte le domande.`;
    const b=axs[1], vb=sc[b.k];
    const first = v<0?a.lp:a.rp;
    let second = '';
    if(Math.abs(vb)>=.35){
      let s2 = vb<0?b.lp:b.rp;
      if(first.startsWith('pensi che ')&&s2.startsWith('pensi che ')) s2=s2.slice(6);
      second = (first.includes(',')?', e ':' e ')+s2;
    }
    return `${PART_PRE[pi]}, ${first}${second}.`;
  });
}
function strong(sc){ return AX.map(a=>({a,v:sc[a.k]})).sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)); }

  const bridges = bps? BRIDGES.filter(b=>b[0](sc,bps.sc)).slice(0,6) : [];
  const answered = ALLQ.filter(q=>ans[q.id]!=null).length;
  const missingFull = LIST.full.filter(q=>ans[q.id]==null).length;
  try{ localStorage.setItem('bfs-scores',JSON.stringify({sc,school:top.x[0],schoolPct:top.pct,phil:phils[0].x[0],sardo:sardi[0].x[0],n:answered})); }catch(e){}

  app.innerHTML = `<div class="stack-lg">
   <div class="stack"><span class="eyebrow">Il tuo risultato · ${answered} risposte</span><h1>Bússola Filosofica</h1></div>

   <section class="family stack">
     <div><span class="tag">Il tuo ritratto</span></div>
     ${pr.map(t=>`<p>${esc(t)}</p>`).join('')}
   </section>

   <section class="stack">
     <span class="eyebrow">La scuola più vicina</span>
     <div class="row" style="justify-content:space-between;align-items:baseline"><p class="match-big">${esc(top.x[0])}</p><span class="pct">${top.pct}%</span></div>
     <p class="lede">${esc(top.x[2])}</p>
     <div class="list">${schools.slice(1,7).map(o=>`<div class="item"><span class="nm">${esc(o.x[0])}</span><span class="pct">${o.pct}%</span><div class="meter"><i style="width:${o.pct}%"></i></div></div>`).join('')}</div>
     <details class="small"><summary>Che cosa dicono le altre scuole</summary><div class="stack" style="margin-top:12px">${schools.slice(1,7).map(o=>`<p><b>${esc(o.x[0])}.</b> <span class="muted">${esc(o.x[2])}</span></p>`).join('')}</div></details>
   </section>

   <hr>
   <section class="stack">
     <div class="stack"><span class="eyebrow">Pensatori</span><h2>Ti somigliano</h2></div>
     <div class="figs">
       ${phils.slice(0,3).map(o=>`<div class="fig"><h3>${esc(o.x[0])}</h3><span class="pct">${o.x[1]?esc(o.x[1])+' · ':''}${o.pct}%</span><span class="small muted">${esc(o.x[4])}</span></div>`).join('')}
       <div class="fig far"><span class="eyebrow" style="color:var(--red)">Il più lontano</span><h3>${esc(far.x[0])}</h3><span class="small muted">${esc(far.x[4])}</span></div>
     </div>
     <div class="sardi stack">
       <span class="eyebrow">Fra i pensatori sardi</span>
       ${sardi.map((o,i)=>`<div class="item"><span class="nm">${esc(o.x[0])}${o.x[1]?` <span class="muted small">${esc(o.x[1])}</span>`:''}</span><span class="pct">${o.pct}%</span><div class="meter"><i style="width:${o.pct}%"></i></div>${i===0?`<span class="sub">${esc(o.x[4])}</span>`:''}</div>`).join('')}
     </div>
   </section>

   <hr>
   <section class="stack">
     <div class="stack"><span class="eyebrow">Dove sei netto, dove no</span><h2>Certezze e domande aperte</h2></div>
     <div class="two">
       <div class="stack"><h3>Le tue posizioni più nette</h3>${sure.length?sure.map(o=>`<p class="pos"><b>${esc(o.a.name)}</b> <span class="muted small">· ${esc(AREAS[o.a.area].t)}</span><br>${esc(cap(o.v<0?o.a.lp:o.a.rp))}.</p>`).join(''):'<p class="muted">Nessuna posizione davvero netta: sei un pensatore prudente.</p>'}</div>
       <div class="stack"><h3>Dove resti in bilico</h3>${open.length?open.map(o=>`<p class="pos"><b>${esc(o.a.name)}</b> <span class="muted small">· ${esc(AREAS[o.a.area].t)}</span><br><span class="muted">tra «${esc(o.a.l)}» e «${esc(o.a.r)}»</span></p>`).join(''):'<p class="muted">Hai una posizione su quasi tutto.</p>'}</div>
     </div>
   </section>

   <hr>
   <section class="stack">
     <div class="stack"><span class="eyebrow">Nodi da sciogliere</span><h2>Dove le tue idee tirano in direzioni diverse</h2>
     <p class="muted small">Non sono errori: sono punti su cui vale la pena pensare. Anche i grandi filosofi ne hanno.</p></div>
     ${knots.length?knots.map(k=>`<div class="knot"><h3>${esc(k[1])}</h3><p>${esc(k[2])}</p></div>`).join(''):'<p>Le tue risposte sono notevolmente coerenti: non abbiamo trovato combinazioni in tensione tra quelle che controlliamo.</p>'}
     ${quirks.length?`<div class="stack" style="margin-top:8px"><span class="eyebrow">Combinazioni rare</span>${quirks.map(k=>`<div class="knot quirk"><h3>${esc(k[1])}</h3><p>${esc(k[2])}</p></div>`).join('')}</div>`:''}
   </section>

   <hr>
   <section class="stack">
     <div class="stack"><span class="eyebrow">Filosofia e politica</span><h2>Le radici delle tue idee politiche</h2></div>
     ${bps?`<p class="muted small">Dalla Bússola Politica Sarda: <b>${esc(bps.fam||'')}</b>${bps.ideo?` · ${esc(bps.ideo)}`:''}.</p>
       ${bridges.length?bridges.map(b=>`<div class="bridge"><p>${esc(b[1])}</p></div>`).join(''):'<p>Le tue posizioni filosofiche e politiche non mostrano legami forti in un senso o nell\'altro: forse tieni filosofia e politica su piani separati.</p>'}
       <div class="pairs">${PAIRS.map(p=>{const a=AXK[p[0]], b=BPS_AX[p[1]]; return `<div class="pair">${mini(a.name,a.l,a.r,sc[p[0]])}${mini(p[3],b[0],b[1],bps.sc[p[1]]||0)}</div>`}).join('')}</div>
       <p class="small muted">In ogni coppia, sopra il tuo asse filosofico e sotto quello politico.</p>`
     :`<p>Non trovo il risultato della Bússola Politica Sarda su questo dispositivo. Se la fai, qui vedrai come la tua filosofia si collega alle tue scelte politiche: sovranità, tradizione, economia, territorio.</p>
       <div><a class="btn" href="./" style="display:inline-block;text-decoration:none">Vai alla Bússola Politica Sarda</a></div>`}
   </section>

   <hr>
   <section class="stack">
     <div class="stack"><span class="eyebrow">Tutti i tuoi assi</span><h2>Il quadro a 360 gradi</h2></div>
     ${AREAS.map((a,ai)=>`<details class="area"${ai===0?' open':''}><summary><span>${esc(a.t)}</span><span class="muted small">${esc(a.sub.split(' · ')[0])}</span></summary><div class="stack-lg" style="margin-top:16px">${a.ax.map(x=>axisBar(x,sc[x.k])).join('')}</div></details>`).join('')}
   </section>

   <hr>
   <section class="stack">
     ${missingFull?`<div class="note"><strong>Vuoi un risultato più preciso?</strong> Rispondi ad altre ${missingFull} domande: quelle già date restano.</div>`:''}
     <div class="row">
       ${missingFull?'<button class="btn" id="deep">Approfondisci</button>':''}
       <button class="btn ${missingFull?'ghost':''}" id="copy">Copia il risultato</button>
       <button class="btn ghost" id="review">Rivedi le risposte</button>
       <button class="btn ghost" id="redo">Rifai il test</button>
     </div>
     <textarea id="copybox" hidden readonly></textarea>
     <p class="small muted" id="copymsg" aria-live="polite"></p>
   </section>

   <details class="small muted">
     <summary>Come funziona</summary>
     <div class="stack" style="margin-top:12px">
      <p>Le aree sono le grandi branche della filosofia; dentro ciascuna, gli assi sono tensioni classiche fra due posizioni. Ogni risposta sposta l'ago di un asse, da −100 a +100. Metà delle affermazioni sono formulate al contrario, per non premiare chi dice sempre sì.</p>
      <p>Le scuole e i pensatori hanno una posizione stimata solo sugli assi su cui hanno una tesi riconoscibile: l'affinità si calcola su quelli. Sono semplificazioni, utili per orientarsi, non schede accademiche. Le posizioni dei pensatori sardi sono stime dai loro scritti e studi.</p>
      <p>I «nodi» segnalano combinazioni che la filosofia considera in tensione. Spesso hanno buone soluzioni: servono a pensare, non a correggerti.</p>
      <p>Le risposte restano solo in questo browser. Il collegamento con la Bússola Politica funziona se hai fatto entrambi i test sullo stesso dispositivo.</p>
     </div>
   </details>
  </div>`;
  const txt = `Bússola Filosofica\n\n${pr.join('\n')}\n\nScuola più vicina: ${top.x[0]} (${top.pct}%)\nAltre: ${schools.slice(1,4).map(o=>`${o.x[0]} ${o.pct}%`).join(', ')}\nPensatori: ${phils.slice(0,3).map(o=>o.x[0]).join(', ')}\nFra i sardi: ${sardi[0].x[0]}\n`+
    (knots.length?`Nodi: ${knots.map(k=>k[1]).join('; ')}\n`:'')+`\n`+
    AX.map(a=>`${a.name}: ${a.l} ${100-Math.round((sc[a.k]+1)*50)}% · ${a.r} ${Math.round((sc[a.k]+1)*50)}%`).join('\n');
  copy.onclick=()=>{
    const fb=()=>{copybox.hidden=false;copybox.value=txt;copybox.select();copymsg.textContent='Testo selezionato: copialo a mano.'};
    try{ navigator.clipboard.writeText(txt).then(()=>copymsg.textContent='Risultato copiato.',fb); }catch(e){fb()}
  };
  const dp=document.getElementById('deep');
  if(dp) dp.onclick=()=>{ mode='full'; deepening=true; idx=LIST.full.findIndex(q=>ans[q.id]==null); view='q'; render(); };
  redo.onclick=()=>{ans={};idx=0;view='intro';render()};
  review.onclick=()=>{idx=0;view='q';render()};
}
const cap = s=>s.charAt(0).toUpperCase()+s.slice(1);

render();
</script>

</body></html>
